# =============== APPLICATION ===============
spring.application.name=ecocompliance
server.port=8080

# =============== ORACLE DATABASE ===============
# Configurar via variveis de ambiente DB_USERNAME e DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME:rm564765}
spring.datasource.password=${DB_PASSWORD:fiap26}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# =============== JPA / HIBERNATE ===============
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# =============== FLYWAY ===============
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# =============== JWT ===============
ecocompliance.jwt.secret=${JWT_SECRET:Y2hhdmUtc2VjcmV0YS1lY29jb21wbGlhbmNlLWFwaS1maWFwLTIwMjUtbXVpdG8tbG9uZ2EtZS1zZWd1cmE=}
ecocompliance.jwt.expiration=86400000

# =============== LOG ===============
logging.level.br.com.fiap.ecocompliance=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
